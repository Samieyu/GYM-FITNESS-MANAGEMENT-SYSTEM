version: '3.8'

services:
  # 1. Database
  postgres:
    image: postgres:16-alpine
    container_name: sweatbox_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-gym_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gym_secure_pass_2026}
      POSTGRES_DB: ${DB_NAME:-gym_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gym_user} -d ${DB_NAME:-gym_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sweatbox_net

  # 2. Node.js Express REST API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sweatbox_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      API_PREFIX: /api/v1
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-gym_user}
      DB_PASSWORD: ${DB_PASSWORD:-gym_secure_pass_2026}
      DB_NAME: ${DB_NAME:-gym_db}
      DB_SSL: "false"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_this_to_a_random_32char_string_for_production}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_this_to_another_random_32char_string}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      QR_HMAC_SECRET: ${QR_HMAC_SECRET:-change_this_to_a_random_hmac_secret_key}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-SWEATBOX Fitness <no-reply@sweatboxfitness.et>}
      CHAPA_SECRET_KEY: ${CHAPA_SECRET_KEY:-CHASECK_TEST-placeholder}
      CHAPA_PUBLIC_KEY: ${CHAPA_PUBLIC_KEY:-CHAPUBK_TEST-placeholder}
      CHAPA_WEBHOOK_SECRET: ${CHAPA_WEBHOOK_SECRET:-chapa_webhook_secret_placeholder}
      CHAPA_BASE_URL: ${CHAPA_BASE_URL:-https://api.chapa.co/v1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - sweatbox_net

  # 3. React SPA Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sweatbox_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - sweatbox_net

  # 4. Top-level Nginx Edge Proxy (Public Entrypoint)
  proxy:
    image: nginx:alpine
    container_name: sweatbox_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - frontend
      - backend
    networks:
      - sweatbox_net

  # 5. Mailpit (Optional for email testing on VM)
  mailpit:
    image: axllent/mailpit:latest
    container_name: sweatbox_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks:
      - sweatbox_net

networks:
  sweatbox_net:
    driver: bridge

volumes:
  pgdata:
  backend_uploads:
  certbot_conf:
  certbot_www:
